<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Serwisu – BarberSerwis</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#2b1b10;
      color:#f5f5f5
    }

    .wrap{
      max-width:1180px;
      margin:0 auto;
      padding:28px 18px 60px
    }

    h1{
      color:#e9b45e;
      margin:0 0 8px;
      text-align:center
    }

    .sub{
      color:#c8c8c8;
      text-align:center;
      margin:0 0 26px
    }

    .panel,.repair{
      background:#18191f;
      border:1px solid #2e3038;
      border-radius:16px;
      padding:20px;
      margin-bottom:18px
    }

    .login-row,.top-row,.grid{
      display:grid;
      gap:12px
    }

    .login-row{
      grid-template-columns:1fr 1fr auto
    }

    .top-row{
      grid-template-columns:1fr auto auto;
      align-items:center
    }

    .grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      margin-top:14px
    }

    input,textarea,select{
      width:100%;
      background:#202129;
      color:#fff;
      border:1px solid #3a3c46;
      border-radius:9px;
      padding:11px 12px;
      font:inherit
    }

    textarea{
      min-height:95px;
      resize:vertical
    }

    label{
      font-size:12px;
      color:#c6c6c6;
      display:block;
      margin-bottom:5px
    }

    button{
      border:0;
      border-radius:9px;
      padding:11px 16px;
      font-weight:700;
      cursor:pointer
    }

    .gold{
      background:#e9b45e;
      color:#17120b
    }

    .dark{
      background:#262832;
      color:#fff;
      border:1px solid #3a3c46
    }

    .danger{
      background:#5f2b2b;
      color:#fff
    }

    .ticket{
      font-weight:800;
      color:#e9b45e;
      font-size:17px
    }

    .muted{
      color:#a8a8aa;
      font-size:13px
    }

    .decision-ok{color:#7fd59a}
    .decision-no{color:#ff9a9a}

    .msg{
      margin-top:10px;
      font-size:14px
    }

    .hidden{
      display:none
    }

    .repair-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:15px
    }

    .client-info{
      line-height:1.7;
      margin-top:10px
    }

    .items-box{
      margin-top:14px;
      padding:14px;
      background:#202129;
      border:1px solid #343640;
      border-radius:12px;
    }

    .items-title{
      color:#e9b45e;
      font-weight:800;
      margin-bottom:10px;
    }

    .item-row{
      padding:10px 0;
      border-top:1px solid #343640;
      line-height:1.6;
    }

    .item-row:first-of-type{
      border-top:0;
      padding-top:0;
    }

    .item-edit-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }

    .item-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .item-msg{
      margin-top:8px;
      font-size:13px;
      color:#cfcfcf;
    }

    @media(max-width:760px){
      .item-edit-grid{
        grid-template-columns:1fr;
      }
    }

    /* STATYSTYKI */

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:18px
    }

    .stat{
      background:#18191f;
      border:1px solid #2e3038;
      border-radius:14px;
      padding:16px;
      text-align:center
    }

    .stat-number{
      display:block;
      font-size:26px;
      font-weight:800;
      color:#e9b45e;
      margin-bottom:4px
    }

    .stat-label{
      font-size:12px;
      color:#aaa
    }

    /* FILTRY */

    .filters{
      display:grid;
      grid-template-columns:2fr 1fr 1fr;
      gap:12px
    }

    .results-info{
      margin-top:12px;
      color:#aaa;
      font-size:13px
    }

    /* STATUSY */

    .status-pill{
      display:inline-block;
      border-radius:999px;
      padding:7px 12px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap
    }

    .status-new{
      background:#343740;
      color:#ddd
    }

    .status-received{
      background:#293c55;
      color:#9dcaff
    }

    .status-diagnosis{
      background:#564321;
      color:#ffd77e
    }

    .status-accept{
      background:#493566;
      color:#d9adff
    }

    .status-repair{
      background:#17465a;
      color:#82dfff
    }

    .status-ready{
      background:#205134;
      color:#86e6a4
    }

    .status-sent{
      background:#354c23;
      color:#b8eb83
    }

    .status-cancelled{
      background:#5a2a2a;
      color:#ffaaaa
    }

    @media(max-width:760px){

      .login-row,
      .top-row,
      .grid,
      .filters{
        grid-template-columns:1fr
      }

      .stats{
        grid-template-columns:repeat(2,1fr)
      }

      .repair-head{
        align-items:flex-start;
        flex-direction:column
      }
    }
  
    .invoice-admin-box{
      margin-top:12px;
      padding:12px 14px;
      background:#202129;
      border:1px solid #343640;
      border-radius:10px;
      line-height:1.65;
    }
    .invoice-admin-yes{color:#86e6a4;font-weight:800}
    .invoice-admin-no{color:#aaa;font-weight:700}

    /* ===== Galeria administratora ===== */
    .gallery-admin-panel{margin-top:18px}
    .gallery-upload-grid{
      display:grid;
      grid-template-columns:1.2fr 1fr auto;
      gap:12px;
      align-items:end;
    }
    .gallery-admin-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      margin-top:18px;
    }
    .gallery-admin-card{
      border:1px solid #343640;
      background:#202128;
      border-radius:12px;
      overflow:hidden;
    }
    .gallery-admin-media{width:100%;aspect-ratio:4/3;object-fit:cover;background:#111;display:block}
    .gallery-admin-body{padding:12px}
    .gallery-admin-caption{color:#ddd;font-size:14px;min-height:22px;margin-bottom:10px}
    .gallery-admin-actions{display:flex;gap:8px;flex-wrap:wrap}
    .gallery-admin-actions button{padding:8px 10px}
    .gallery-hidden-badge{color:#ffcf76;font-weight:700;font-size:12px}
    @media(max-width:800px){
      .gallery-upload-grid{grid-template-columns:1fr}
      .gallery-admin-grid{grid-template-columns:1fr 1fr}
    }
    @media(max-width:520px){.gallery-admin-grid{grid-template-columns:1fr}}


    /* ===== Uporządkowany panel administratora ===== */
    .admin-nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .admin-nav a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:10px;
      border:1px solid rgba(224,179,106,.28);
      background:#202028;
      color:#f0c988;
      font-weight:700;
      text-decoration:none;
      cursor:pointer;
    }
    .admin-nav a:hover{
      border-color:rgba(224,179,106,.65);
      background:#272731;
    }
    .admin-section-title{
      margin:28px 0 12px;
      padding-bottom:10px;
      border-bottom:1px solid rgba(224,179,106,.22);
      color:#f0c988;
      font-size:24px;
    }
    .admin-section-note{
      color:#aaa;
      margin:-4px 0 16px;
      font-size:14px;
    }
    #repairsSection,
    #gallerySection{
      scroll-margin-top:18px;
    }


    .scroll-top-btn{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:9999;
      width:48px;
      height:48px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      font-size:24px;
      font-weight:700;
      line-height:48px;
      text-align:center;
      box-shadow:0 4px 14px rgba(0,0,0,.28);
      opacity:.9;
    }
    .scroll-top-btn:hover{opacity:1}


    /* ===== Kosztorys naprawy ===== */
    .quote-builder{
      margin-top:14px;
      padding:14px;
      border:1px solid #3a3c46;
      border-radius:12px;
      background:#17181e;
    }
    .quote-builder-title{
      color:#e9b45e;
      font-weight:800;
      font-size:15px;
      margin-bottom:10px;
    }
    .quote-lines{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:10px;
    }
    .quote-line{
      display:grid;
      grid-template-columns:minmax(0,2fr) 90px 130px 44px;
      gap:8px;
      align-items:center;
    }
    .quote-line-total{
      text-align:right;
      color:#f0c988;
      font-weight:800;
      font-size:13px;
      padding-right:2px;
    }
    .quote-add-grid{
      display:grid;
      grid-template-columns:minmax(0,2fr) 130px auto auto;
      gap:8px;
      align-items:end;
      margin-top:10px;
    }
    .quote-custom-grid{
      display:grid;
      grid-template-columns:minmax(0,2fr) 130px auto;
      gap:8px;
      align-items:end;
      margin-top:8px;
    }
    .quote-summary{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid #343640;
      font-size:16px;
    }
    .quote-summary strong{
      color:#e9b45e;
      font-size:19px;
    }
    .quote-help{
      color:#aaa;
      font-size:12px;
      margin-top:8px;
      line-height:1.5;
    }
    @media(max-width:760px){
      .quote-line{
        grid-template-columns:1fr 80px 110px 42px;
      }
      .quote-line .quote-line-total{
        grid-column:1/-1;
        text-align:left;
      }
      .quote-add-grid,
      .quote-custom-grid{
        grid-template-columns:1fr;
      }
    }

</style>
</head>

<body>

<div class="wrap">

  <h1>Panel Serwisu – BarberSerwis</h1>
  <p class="sub">
    Obsługa zgłoszeń, wycen, statusów i informacji dla klienta.
  </p>

  <!-- LOGOWANIE -->

  <div class="panel" id="loginPanel">

    <div class="login-row">

      <input
        type="email"
        id="adminEmail"
        placeholder="E-mail administratora"
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Hasło"
      >

      <button
        class="gold"
        onclick="adminLogin()"
      >
        Zaloguj
      </button>

    </div>

    <div id="loginMsg" class="msg"></div>

  </div>


  <!-- PANEL ADMINA -->

  <div class="panel hidden" id="adminPanel">

    <div class="top-row">

      <div id="adminStatus">
        Zalogowano
      </div>

      <button
        class="dark"
        onclick="loadAllRepairs()"
      >
        Odśwież zgłoszenia
      </button>

      <button
        class="dark"
        onclick="adminLogout()"
      >
        Wyloguj
      </button>

    </div>

    <div class="admin-nav">
      <a href="#repairsSection">Zgłoszenia</a>
      <a href="#gallerySection">Galeria</a>
    </div>

  </div>


  <!-- ZGŁOSZENIA / STATYSTYKI / FILTRY -->

<!-- STATYSTYKI -->

  <div id="statsPanel" class="stats hidden">

    <div class="stat">
      <span class="stat-number" id="countAll">0</span>
      <span class="stat-label">Wszystkie</span>
    </div>

    <div class="stat">
      <span class="stat-number" id="countNew">0</span>
      <span class="stat-label">Nowe</span>
    </div>

    <div class="stat">
      <span class="stat-number" id="countRepair">0</span>
      <span class="stat-label">W naprawie</span>
    </div>

    <div class="stat">
      <span class="stat-number" id="countReady">0</span>
      <span class="stat-label">Gotowe</span>
    </div>

  </div>


  <!-- WYSZUKIWANIE / FILTRY -->

  <div id="filtersPanel" class="panel hidden">

    <div class="filters">

      <div>

        <label>Wyszukaj zgłoszenie</label>

        <input
          id="searchRepair"
          type="text"
          placeholder="Numer zgłoszenia, klient, telefon, e-mail, nazwa sprzętu, model..."
          oninput="applyFilters()"
        >

      </div>


      <div>

        <label>Status</label>

        <select
          id="statusFilter"
          onchange="applyFilters()"
        >

          <option value="">Wszystkie statusy</option>

          <option value="Nowe zgłoszenie">
            Nowe zgłoszenie
          </option>

          <option value="Przyjęto">
            Przyjęto
          </option>

          <option value="Diagnoza / wycena">
            Diagnoza / wycena
          </option>

          <option value="Akceptacja">
            Akceptacja
          </option>

          <option value="Naprawa">
            Naprawa
          </option>

          <option value="Gotowe">
            Gotowe
          </option>

          <option value="Odesłano">
            Odesłano
          </option>

        </select>

      </div>


      <div>

        <label>Sortowanie</label>

        <select
          id="sortRepairs"
          onchange="applyFilters()"
        >

          <option value="newest">
            Najnowsze
          </option>

          <option value="oldest">
            Najstarsze
          </option>

        </select>

      </div>

    </div>

    <div
      id="resultsInfo"
      class="results-info"
    ></div>

  </div>


  <!-- ZGŁOSZENIA -->

  <div id="repairs"></div>

  <div id="gallerySection">
    <h2 class="admin-section-title">Galeria strony</h2>
    <p class="admin-section-note">Dodawaj, ukrywaj, porządkuj i usuwaj zdjęcia oraz filmy widoczne na stronie głównej.</p>
  </div>

<div id="galleryAdminPanel" class="panel hidden gallery-admin-panel">
    <div class="gallery-upload-grid">
      <div>
        <label>Zdjęcie lub film</label>
        <input id="galleryFile" type="file" accept="image/*,video/mp4,video/webm,video/quicktime">
      </div>
      <div>
        <label>Podpis (opcjonalnie)</label>
        <input id="galleryCaption" type="text" maxlength="180" placeholder="np. Naprawa Wahl Senior">
      </div>
      <button class="gold" id="galleryUploadBtn" onclick="uploadGalleryMedia()">Dodaj do galerii</button>
    </div>

    <div id="galleryMsg" class="msg"></div>
    <div id="galleryAdminGrid" class="gallery-admin-grid"></div>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://smimabuumtdjkymxpheq.supabase.co";

const SUPABASE_PUBLIC_KEY =
  "sb_publishable_hv64LFqZTVbVk6Tza29s9w_dXytRVyr";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY
  );



let allRepairs = [];
let servicePriceList = [];
let quoteLinesByItem = {};

function quoteLineKey(){
  return "ql-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function getQuoteLines(itemId){
  return Array.isArray(quoteLinesByItem[itemId]) ? quoteLinesByItem[itemId] : [];
}

function quoteItemTotal(itemId){
  return getQuoteLines(itemId).reduce((sum,line)=>{
    const qty = Number(line.quantity ?? 1);
    const price = Number(line.unit_price ?? 0);
    const total = (Number.isFinite(qty) ? qty : 0) * (Number.isFinite(price) ? price : 0);
    return sum + total;
  },0);
}

function priceListOptions(){
  const rows = servicePriceList.filter(x=>x.active !== false);
  return `
    <option value="">Wybierz pozycję z cennika</option>
    ${rows.map(x=>`
      <option value="${esc(x.id)}">
        ${esc(x.name)}${x.default_price != null ? " – " + Number(x.default_price).toFixed(2) + " zł" : ""}
      </option>
    `).join("")}
  `;
}

function renderQuoteLines(itemId){
  const box = document.getElementById("quote-lines-"+itemId);
  const totalBox = document.getElementById("quote-total-"+itemId);
  const oldQuoteInput = document.getElementById("item-quote-"+itemId);

  if(!box) return;

  const lines = getQuoteLines(itemId);

  if(!lines.length){
    box.innerHTML = '<div class="muted">Brak pozycji kosztorysu.</div>';
  }else{
    box.innerHTML = lines.map(line=>{
      const key = line._key || line.id || quoteLineKey();
      line._key = key;

      const qty = Number(line.quantity ?? 1);
      const price = Number(line.unit_price ?? 0);
      const lineTotal =
        (Number.isFinite(qty) ? qty : 0) *
        (Number.isFinite(price) ? price : 0);

      return `
        <div class="quote-line" data-key="${esc(key)}">
          <input
            type="text"
            value="${esc(line.description || "")}"
            oninput="updateQuoteLine('${itemId}','${key}','description',this.value)"
            placeholder="Pozycja kosztorysu"
          >

          <input
            type="number"
            min="0.01"
            step="0.01"
            value="${Number.isFinite(qty) ? qty : 1}"
            oninput="updateQuoteLine('${itemId}','${key}','quantity',this.value)"
            title="Ilość"
          >

          <input
            type="number"
            min="0"
            step="0.01"
            value="${Number.isFinite(price) ? price.toFixed(2) : "0.00"}"
            oninput="updateQuoteLine('${itemId}','${key}','unit_price',this.value)"
            title="Cena jednostkowa"
          >

          <button
            type="button"
            class="danger"
            style="padding:9px 10px;"
            onclick="removeQuoteLine('${itemId}','${key}')"
            title="Usuń pozycję"
          >×</button>

          <div class="quote-line-total">
            Razem pozycja: ${lineTotal.toFixed(2)} zł
          </div>
        </div>
      `;
    }).join("");
  }

  const total = quoteItemTotal(itemId);

  if(totalBox){
    totalBox.textContent = total.toFixed(2) + " zł";
  }

  if(oldQuoteInput){
    oldQuoteInput.value = total.toFixed(2);
  }

  const repair = getRepairByItemId(itemId);
  if(repair){
    const totalInput = document.getElementById("quote-"+repair.id);
    if(totalInput){
      const repairTotal = repair.items.reduce((sum,item)=>{
        return sum + quoteItemTotal(item.id);
      },0);
      totalInput.value = repairTotal.toFixed(2) + " zł";
    }
  }
}

function updateQuoteLine(itemId,key,field,value){
  const line = getQuoteLines(itemId).find(x => String(x._key || x.id) === String(key));
  if(!line) return;

  if(field === "quantity" || field === "unit_price"){
    const n = Number(value);
    line[field] = Number.isFinite(n) ? n : 0;
  }else{
    line[field] = value;
  }

  renderQuoteLines(itemId);
}

function removeQuoteLine(itemId,key){
  quoteLinesByItem[itemId] = getQuoteLines(itemId).filter(
    x => String(x._key || x.id) !== String(key)
  );
  renderQuoteLines(itemId);
}

function addPriceListLine(itemId){
  const select = document.getElementById("quote-price-select-"+itemId);
  const priceInput = document.getElementById("quote-price-"+itemId);

  const priceId = select?.value || "";
  if(!priceId){
    alert("Wybierz pozycję z cennika.");
    return;
  }

  const service = servicePriceList.find(x => String(x.id) === String(priceId));
  if(!service){
    alert("Nie znaleziono pozycji cennika.");
    return;
  }

  let price = Number(priceInput?.value);
  if(!Number.isFinite(price)){
    price = Number(service.default_price ?? 0);
  }

  getQuoteLines(itemId).push({
    _key: quoteLineKey(),
    id: null,
    repair_item_id: itemId,
    price_list_id: service.id,
    description: service.name,
    quantity: 1,
    unit_price: price,
    sort_order: getQuoteLines(itemId).length * 10
  });

  if(select) select.value = "";
  if(priceInput) priceInput.value = "";

  renderQuoteLines(itemId);
}

function fillPriceFromList(itemId){
  const select = document.getElementById("quote-price-select-"+itemId);
  const priceInput = document.getElementById("quote-price-"+itemId);
  const service = servicePriceList.find(x => String(x.id) === String(select?.value));

  if(priceInput){
    priceInput.value =
      service && service.default_price != null
        ? Number(service.default_price).toFixed(2)
        : "";
  }
}

function addCustomQuoteLine(itemId){
  const descEl = document.getElementById("quote-custom-desc-"+itemId);
  const priceEl = document.getElementById("quote-custom-price-"+itemId);

  const description = descEl?.value.trim() || "";
  const price = Number(priceEl?.value);

  if(!description){
    alert("Wpisz nazwę własnej pozycji.");
    return;
  }

  if(!Number.isFinite(price) || price < 0){
    alert("Wpisz prawidłową cenę.");
    return;
  }

  getQuoteLines(itemId).push({
    _key: quoteLineKey(),
    id: null,
    repair_item_id: itemId,
    price_list_id: null,
    description,
    quantity: 1,
    unit_price: price,
    sort_order: getQuoteLines(itemId).length * 10
  });

  if(descEl) descEl.value = "";
  if(priceEl) priceEl.value = "";

  renderQuoteLines(itemId);
}

async function saveQuoteLines(itemId){
  const msg = document.getElementById("item-msg-"+itemId);
  const lines = getQuoteLines(itemId);

  if(msg) msg.textContent = "Zapisywanie kosztorysu…";

  const {error:deleteError} =
    await sb
      .from("repair_item_quote_lines")
      .delete()
      .eq("repair_item_id",itemId);

  if(deleteError){
    if(msg) msg.textContent = "Błąd usuwania starego kosztorysu: " + deleteError.message;
    return false;
  }

  if(lines.length){
    const rows = lines.map((line,index)=>({
      repair_item_id:itemId,
      price_list_id:line.price_list_id || null,
      description:String(line.description || "").trim(),
      quantity:Number(line.quantity ?? 1) || 1,
      unit_price:Number(line.unit_price ?? 0) || 0,
      sort_order:index * 10
    }));

    const {error:insertError} =
      await sb
        .from("repair_item_quote_lines")
        .insert(rows);

    if(insertError){
      if(msg) msg.textContent = "Błąd zapisu kosztorysu: " + insertError.message;
      return false;
    }
  }

  return true;
}

async function loadGalleryAdmin(){

    .select("id,media_type,storage_path,caption,is_visible,sort_order,created_at")

    return;
  }

  }

  box.innerHTML=data.map(item=>{
    const {data:urlData}=sb.storage.from("gallery").getPublicUrl(item.storage_path);

    const media=item.media_type==="video"
      ? `<video class="gallery-admin-media" controls preload="metadata"><source src="${esc(url)}"></video>`

          <button class="dark" onclick="moveGalleryItem('${item.id}',-1)">↑</button>
          <button class="dark" onclick="moveGalleryItem('${item.id}',1)">↓</button>
          <button class="danger" onclick="deleteGalleryMedia('${item.id}','${esc(item.storage_path)}')">Usuń</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

async function uploadGalleryMedia(){
  const fileInput=document.getElementById("galleryFile");
  const caption=document.getElementById("galleryCaption").value.trim();
  const msg=document.getElementById("galleryMsg");
  const btn=document.getElementById("galleryUploadBtn");
  const file=fileInput.files?.[0];

  if(!file){msg.textContent="Wybierz zdjęcie albo film.";return;}
  const isImage=file.type.startsWith("image/");
  const isVideo=file.type.startsWith("video/");
  if(!isImage&&!isVideo){msg.textContent="Dozwolone są tylko zdjęcia i filmy.";return;}
  if(file.size>50*1024*1024){msg.textContent="Plik jest za duży. Maksymalnie 50 MB.";return;}

  btn.disabled=true;
  msg.textContent="Wysyłanie pliku…";

  const ext=(file.name.split(".").pop()|| (isImage?"jpg":"mp4")).toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;

  const {error:uploadError}=await sb.storage.from("gallery").upload(path,file,{upsert:false,contentType:file.type});
  if(uploadError){msg.textContent="Błąd wysyłania: "+uploadError.message;btn.disabled=false;return;}

  const {data:maxData}=await sb.from("gallery_media").select("sort_order").order("sort_order",{ascending:false}).limit(1);
  const nextOrder=(maxData?.[0]?.sort_order??0)+10;

  const {error:insertError}=await sb.from("gallery_media").insert({
    media_type:isVideo?"video":"image",
    storage_path:path,
    caption:caption||null,
    is_visible:true,
    sort_order:nextOrder
  });

  if(insertError){
    await sb.storage.from("gallery").remove([path]);
    msg.textContent="Błąd zapisu galerii: "+insertError.message;
    btn.disabled=false;
    return;
  }

  fileInput.value="";
  document.getElementById("galleryCaption").value="";
  msg.textContent="Dodano do galerii ✅";
  btn.disabled=false;
  await loadGalleryAdmin();
}

async function toggleGalleryVisibility(id,visible){
  const {error}=await sb.from("gallery_media").update({is_visible:visible}).eq("id",id);
  if(error){alert("Błąd: "+error.message);return;}
  await loadGalleryAdmin();
}

async function deleteGalleryMedia(id,path){
  if(!confirm("Usunąć ten element z galerii?")) return;
  const {error:storageError}=await sb.storage.from("gallery").remove([path]);
  if(storageError){alert("Nie udało się usunąć pliku: "+storageError.message);return;}
  const {error}=await sb.from("gallery_media").delete().eq("id",id);
  if(error){alert("Plik usunięto, ale błąd wpisu galerii: "+error.message);return;}
  await loadGalleryAdmin();
}

async function moveGalleryItem(id,direction){
  const {data,error}=await sb.from("gallery_media")
    .select("id,sort_order")
    .order("sort_order",{ascending:true})
    .order("created_at",{ascending:false});
  if(error||!data) return;
  const index=data.findIndex(x=>x.id===id);
  const otherIndex=index+direction;
  if(index<0||otherIndex<0||otherIndex>=data.length) return;
  const current=data[index],other=data[otherIndex];
  const a=current.sort_order??index*10,b=other.sort_order??otherIndex*10;
  const r1=await sb.from("gallery_media").update({sort_order:b}).eq("id",current.id);
  if(r1.error){alert("Błąd zmiany kolejności: "+r1.error.message);return;}
  const r2=await sb.from("gallery_media").update({sort_order:a}).eq("id",other.id);
  if(r2.error){alert("Błąd zmiany kolejności: "+r2.error.message);return;}
  await loadGalleryAdmin();
}


/* =============================
   BEZPIECZNY TEKST
============================= */

function esc(v){

  return String(v ?? "")
    .replace(/[&<>'"]/g, ch => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    })[ch]);

}


/* =============================
   DECYZJA KLIENTA
============================= */

function decisionText(v){

  if(v === "accepted"){

    return `
      <span class="decision-ok">
        Zaakceptowana ✅
      </span>
    `;

  }

  if(v === "rejected"){

    return `
      <span class="decision-no">
        Odrzucona ❌
      </span>
    `;

  }

  return "Brak decyzji";

}


/* =============================
   KOLOR STATUSU
============================= */


function normalizeItemStatus(status){
  const s = String(status || "").trim();

  if(s === "Przyjęto" || s === "Przyjęto / diagnostyka"){
    return "Przyjęto – oczekuje na diagnostykę";
  }

  if(s === "Diagnoza / wycena"){
    return "Sprzęt jest w trakcie diagnostyki";
  }

  if(s === "Akceptacja"){
    return "Wycena";
  }

  return s || "Nowe zgłoszenie";
}

function statusClass(status){

  switch(status){

    case "Nowe zgłoszenie":
      return "status-new";

    case "Przyjęto":
    case "Przyjęto / diagnostyka":
    case "Przyjęto – oczekuje na diagnostykę":
      return "status-received";

    case "Diagnoza / wycena":
    case "Sprzęt jest w trakcie diagnostyki":
    case "Wycena":
      return "status-diagnosis";

    case "Akceptacja":
      return "status-accept";

    case "Naprawa":
      return "status-repair";

    case "Gotowe":
      return "status-ready";

    case "Odesłano":
      return "status-sent";

    case "Bez naprawy / do odesłania":
      return "status-cancelled";

    case "Anulowane":
      return "status-cancelled";

    default:
      return "status-new";

  }

}

async function loadAllRepairs(){

  const box =
    document.getElementById("repairs");

  box.innerHTML =
    '<div class="panel">Ładowanie zgłoszeń…</div>';

  const {data:priceData,error:priceError} =
    await sb
      .from("service_price_list")
      .select("id,name,default_price,active,sort_order")
      .eq("active",true)
      .order("sort_order",{ascending:true})
      .order("name",{ascending:true});

  if(priceError){
    box.innerHTML =
      '<div class="panel">Nie udało się pobrać cennika: '
      + esc(priceError.message)
      + '</div>';
    return;
  }

  servicePriceList = Array.isArray(priceData) ? priceData : [];


  const {data,error} =
    await sb.rpc("admin_list_repairs");


  if(error){

    box.innerHTML =
      '<div class="panel">'
      +
      'Brak dostępu do panelu administratora albo błąd: '
      +
      esc(error.message)
      +
      '</div>';

    return;

  }


  allRepairs =
    Array.isArray(data)
      ? data
      : [];

  // Pobierz wszystkie sprzęty należące do zgłoszeń.
  const repairIds = allRepairs.map(r => r.id).filter(Boolean);

  if(repairIds.length){
    const {data:itemsData,error:itemsError} =
      await sb
        .from("repair_items")
        .select("id,repair_id,item_no,device_name,model,issue_type,problem,status,quote_amount,admin_note,quote_decision")
        .in("repair_id",repairIds)
        .order("item_no",{ascending:true});

    if(itemsError){
      box.innerHTML =
        '<div class="panel">Nie udało się pobrać sprzętów: '
        + esc(itemsError.message)
        + '</div>';
      return;
    }

    allRepairs.forEach(r => {
      r.items = (itemsData || []).filter(item =>
        String(item.repair_id) === String(r.id)
      );
    });

    const itemIds = (itemsData || []).map(x=>x.id).filter(Boolean);

    quoteLinesByItem = {};

    if(itemIds.length){
      const {data:quoteLinesData,error:quoteLinesError} =
        await sb
          .from("repair_item_quote_lines")
          .select("id,repair_item_id,price_list_id,description,quantity,unit_price,line_total,sort_order")
          .in("repair_item_id",itemIds)
          .order("sort_order",{ascending:true})
          .order("created_at",{ascending:true});

      if(quoteLinesError){
        box.innerHTML =
          '<div class="panel">Nie udało się pobrać kosztorysów: '
          + esc(quoteLinesError.message)
          + '</div>';
        return;
      }

      itemIds.forEach(id => quoteLinesByItem[id] = []);

      (quoteLinesData || []).forEach(line=>{
        line._key = line.id || quoteLineKey();
        (quoteLinesByItem[line.repair_item_id] ||= []).push(line);
      });

      // Kompatybilność ze starymi wycenami:
      // jeśli sprzęt ma starą quote_amount, ale nie ma jeszcze pozycji kosztorysu,
      // pokazujemy ją jako jedną tymczasową pozycję "Dotychczasowa wycena".
      (itemsData || []).forEach(item=>{
        const lines = quoteLinesByItem[item.id] || [];
        if(
          !lines.length &&
          item.quote_amount != null &&
          Number.isFinite(Number(item.quote_amount)) &&
          Number(item.quote_amount) > 0
        ){
          quoteLinesByItem[item.id] = [{
            _key:quoteLineKey(),
            id:null,
            repair_item_id:item.id,
            price_list_id:null,
            description:"Dotychczasowa wycena",
            quantity:1,
            unit_price:Number(item.quote_amount),
            sort_order:0
          }];
        }
      });
    }
  }else{
    allRepairs.forEach(r => r.items = []);
    quoteLinesByItem = {};
  }


  updateStats();

  applyFilters();

}

/* =============================
   FILTROWANIE
============================= */

function applyFilters(){

  const search =
    document
      .getElementById("searchRepair")
      .value
      .trim()
      .toLowerCase();

  const status =
    document
      .getElementById("statusFilter")
      .value;

  const sort =
    document
      .getElementById("sortRepairs")
      .value;


  let filtered =
    [...allRepairs];


  if(search){

    filtered =
      filtered.filter(r => {

        const text = [
          r.ticket_no,
          r.name,
          r.phone,
          r.email,
          r.model,
          r.issue_type,
          r.problem,
          ...(r.items || []).flatMap(item => [
            item.device_name,
            item.model,
            item.issue_type,
            item.problem
          ]),
          r.return_address,
          r.return_city,
          r.tracking,
          r.invoice_company_name,
          r.invoice_nip,
          r.invoice_address,
          r.invoice_postal_code,
          r.invoice_city
        ]
        .join(" ")
        .toLowerCase();

        return text.includes(search);

      });

  }


  if(status){

    filtered =
      filtered.filter(r =>
        r.status === status
      );

  }


  filtered.sort((a,b) => {

    const dateA =
      new Date(a.created_at || 0).getTime();

    const dateB =
      new Date(b.created_at || 0).getTime();

    if(sort === "oldest"){

      return dateA - dateB;

    }

    return dateB - dateA;

  });


  document
    .getElementById("resultsInfo")
    .textContent =
    "Wyświetlono "
    + filtered.length
    + " z "
    + allRepairs.length
    + " zgłoszeń";


  renderRepairs(filtered);

}

}



function getRepairByItemId(itemId){
  return allRepairs.find(r =>
    Array.isArray(r.items) &&
    r.items.some(item => String(item.id) === String(itemId))
  ) || null;
}

function calculateRepairTotalFromDom(repair){
  if(!repair || !Array.isArray(repair.items)) return 0;

  return repair.items.reduce((sum,item)=>{
    return sum + quoteItemTotal(item.id);
  },0);
}

/* =============================
   ZAPIS POJEDYNCZEGO SPRZĘTU
============================= */

async function saveRepairItem(itemId){

  const status =
    document.getElementById("item-status-"+itemId).value;

  const quoteTotal = quoteItemTotal(itemId);

  const quote =
    getQuoteLines(itemId).length ? quoteTotal : null;

  const note =
    document.getElementById("item-note-"+itemId).value.trim() || null;

  const msg =
    document.getElementById("item-msg-"+itemId);

  msg.textContent = "Zapisywanie…";

  const quoteLinesSaved = await saveQuoteLines(itemId);
  if(!quoteLinesSaved){
    return;
  }

  const repair = getRepairByItemId(itemId);

  if(!repair){
    msg.textContent = "Błąd: nie znaleziono zgłoszenia dla tego sprzętu.";
    return;
  }

  const oldItem = repair.items.find(item => String(item.id) === String(itemId));
  const oldStatus = oldItem?.status || "";
  const statusChanged = oldStatus !== status;

  const {error} =
    await sb.rpc("admin_update_repair_item",{
      p_item_id:itemId,
      p_status:status,
      p_quote_amount:quote,
      p_admin_note:note
    });

  if(error){
    msg.textContent = "Błąd: " + error.message;
    return;
  }

  // Aktualizujemy dane lokalne przed policzeniem sumy.
  const localItem = repair.items.find(item => String(item.id) === String(itemId));
  if(localItem){
    localItem.status = status;
    localItem.quote_amount = quote;
    localItem.admin_note = note;
  }

  const totalQuote = calculateRepairTotalFromDom(repair);

  // Synchronizacja łącznej wyceny w głównym zgłoszeniu
  const {error:syncError} =
    await sb.rpc("admin_update_repair",{
      p_id:repair.id,
      p_status:repair.status || "Nowe zgłoszenie",
      p_quote_amount:totalQuote,
      p_admin_note:repair.admin_note || null,
      p_tracking:repair.tracking || null
    });

  if(syncError){
    msg.textContent =
      "Sprzęt zapisany, ale nie udało się zaktualizować łącznej wyceny: "
      + syncError.message;
    return;
  }

  msg.textContent = "Sprzęt zapisany ✅ E-mail nie został wysłany.";

  setTimeout(loadAllRepairs,500);
}

async function setQuickItemStatus(itemId,status){
  document.getElementById("item-status-"+itemId).value = status;
  await saveRepairItem(itemId);
}


/* =============================
   ZAPIS
============================= */

async function saveRepair(id){

  const status =
    document.getElementById("status-"+id).value;

  const repairForTotal =
    allRepairs.find(r => String(r.id) === String(id));

  const quote =
    calculateRepairTotalFromDom(repairForTotal);

  const note =
    document.getElementById("note-"+id).value.trim() || null;

  const tracking =
    document.getElementById("tracking-"+id).value.trim() || null;

  const msg =
    document.getElementById("msg-"+id);

  msg.textContent = "Zapisywanie…";

  const {error} =
    await sb.rpc("admin_update_repair",{
      p_id:id,
      p_status:status,
      p_quote_amount:quote,
      p_admin_note:note,
      p_tracking:tracking
    });

  if(error){
    msg.textContent = "Błąd: " + error.message;
    return;
  }

  const localRepair =
    allRepairs.find(r => String(r.id) === String(id));

  if(localRepair){
    localRepair.status = status;
    localRepair.quote_amount = quote;
    localRepair.admin_note = note;
    localRepair.tracking = tracking;
  }

  msg.textContent = "Zmiany zapisane ✅ E-mail nie został wysłany.";

  setTimeout(loadAllRepairs,500);
}


async function sendRepairEmail(id){

  const repair =
    allRepairs.find(r => String(r.id) === String(id));

  if(!repair){
    alert("Nie znaleziono zgłoszenia.");
    return;
  }

  const msg =
    document.getElementById("msg-"+id);

  if(!confirm("Wysłać klientowi jeden zbiorczy e-mail z aktualnym stanem całego zgłoszenia?")){
    return;
  }

  msg.textContent = "Wysyłanie e-maila…";

  const {error} =
    await sb.functions.invoke("swift-responder",{
      body:{
        repair_id:id
      }
    });

  if(error){
    msg.textContent =
      "Nie udało się wysłać e-maila: " + error.message;
    return;
  }

  msg.textContent =
    "Zbiorczy e-mail do klienta wysłany ✅";
}


async function cancelRepairAdmin(id){

  if(!confirm("Czy na pewno anulować całe zgłoszenie?")){
    return;
  }

  const repair =
    allRepairs.find(r => String(r.id) === String(id));

  if(!repair){
    alert("Nie znaleziono zgłoszenia.");
    return;
  }

  const totalQuote =
    calculateRepairTotalFromDom(repair);

  const {error} =
    await sb.rpc("admin_update_repair",{
      p_id:id,
      p_status:"Anulowane",
      p_quote_amount:totalQuote,
      p_admin_note:repair.admin_note || null,
      p_tracking:repair.tracking || null
    });

  if(error){
    alert("Nie udało się anulować zgłoszenia: " + error.message);
    return;
  }

  if(Array.isArray(repair.items)){
    for(const item of repair.items){
      const {error:itemError} =
        await sb.rpc("admin_update_repair_item",{
          p_item_id:item.id,
          p_status:"Anulowane",
          p_quote_amount:item.quote_amount ?? null,
          p_admin_note:item.admin_note || null
        });

      if(itemError){
        alert("Zgłoszenie anulowano, ale nie udało się zaktualizować jednego sprzętu: " + itemError.message);
        break;
      }
    }
  }

  const {error:mailError} =
    await sb.functions.invoke("swift-responder",{
      body:{
        repair_id:id
      }
    });

  if(mailError){
    alert("Zgłoszenie anulowano, ale e-mail nie został wysłany: " + mailError.message);
  }else{
    alert("Zgłoszenie anulowano ✅");
  }

  await loadAllRepairs();
}

  document
